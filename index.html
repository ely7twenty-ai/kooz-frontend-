<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kooz</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      color: #333;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
    }
    .header {
      text-align: center;
      padding: 40px 0 20px;
    }
    .header h1 {
      font-size: 28px;
      color: #2d2d2d;
    }
    .status {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 16px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .card h2 {
      font-size: 20px;
      margin-bottom: 12px;
      color: #1a1a1a;
    }
    .card p {
      color: #666;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .price {
      color: #007AFF;
      font-weight: 600;
      font-size: 18px;
    }
    .loader {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #ddd;
      border-top-color: #007AFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #e74c3c; }
    .success { color: #27ae60; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <script>
    const API_URL = 'https://kooz-backend.onrender.com';
    const { useState, useEffect } = React;

    function App() {
      const [status, setStatus] = useState('Загрузка...');
      const [user, setUser] = useState(null);
      const [isError, setIsError] = useState(false);

      useEffect(() => {
        const tg = window.Telegram?.WebApp;

        if (!tg) {
          setStatus('Откройте через Telegram Mini App');
          return;
        }

        tg.ready();
        tg.expand();
        tg.setHeaderColor('#f5f5f5');
        tg.setBackgroundColor('#f5f5f5');

        const initData = tg.initData;

        if (!initData) {
          setStatus('Ошибка: нет initData. Перезапустите через бота.');
          setIsError(true);
          return;
        }

        setStatus('Авторизация...');

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000);

        fetch(API_URL + '/api/auth/telegram', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData }),
          signal: controller.signal,
        })
          .then(async (r) => {
            clearTimeout(timeoutId);
            if (!r.ok) {
              const text = await r.text();
              throw new Error('Сервер ответил ' + r.status + ': ' + text);
            }
            return r.json();
          })
          .then((data) => {
            if (data.error) throw new Error(data.error);
            setUser(data.user);
            setStatus('ok');
          })
          .catch((err) => {
            if (err.name === 'AbortError') {
              setStatus('Сервер долго не отвечает. Подождите 30 сек и обновите — бэкенд просыпается.');
            } else {
              setStatus('Ошибка: ' + err.message);
            }
            setIsError(true);
          });
      }, []);

      if (status === 'ok' && user) {
        return React.createElement('div', { className: 'container' },
          React.createElement('div', { className: 'header' },
            React.createElement('h1', null, '👋 Привет, ' + (user.firstName || 'друг') + '!')
          ),
          React.createElement('div', { className: 'card' },
            React.createElement('h2', null, '🎨 Салон красоты "Анна"'),
            React.createElement('p', null, 'Услуга: Маникюр с покрытием'),
            React.createElement('p', { className: 'price' }, '1 500 ₽'),
            React.createElement('p', null, '⏱ 60 минут')
          ),
          React.createElement('div', { className: 'card' },
            React.createElement('p', { className: 'success' }, '✅ Авторизация прошла успешно'),
            React.createElement('p', null, 'Роль: ' + user.role)
          )
        );
      }

      return React.createElement('div', { className: 'container' },
        React.createElement('div', { className: 'header' },
          React.createElement('h1', null, 'Kooz')
        ),
        React.createElement('div', { className: 'status' + (isError ? ' error' : '') },
          !isError && status !== 'Откройте через Telegram Mini App' 
            ? React.createElement('span', { className: 'loader' }) 
            : null,
          status
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
