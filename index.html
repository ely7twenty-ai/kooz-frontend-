          <!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kooz — Диагностика</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; color: #333; padding: 16px; }
    .container { max-width: 480px; margin: 0 auto; }
    h1 { text-align: center; padding: 20px 0; font-size: 22px; }
    .card { background: white; border-radius: 12px; padding: 16px; margin-top: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .card h2 { font-size: 15px; margin-bottom: 8px; color: #1a1a1a; }
    .log { font-family: monospace; font-size: 11px; background: #f8f9fa; padding: 10px; border-radius: 8px; margin-top: 8px; white-space: pre-wrap; word-break: break-all; max-height: 400px; overflow-y: auto; }
    .btn { display: block; width: 100%; padding: 12px; margin-top: 12px; background: #007AFF; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Kooz — Диагностика</h1>
    <div class="card">
      <h2>Логи</h2>
      <div class="log" id="log">Загрузка...</div>
    </div>
    <button class="btn" onclick="runTests()">🔄 Повторить тесты</button>
  </div>

  <script>
    const API_URL = 'https://kooz-backend.onrender.com';
    const logEl = document.getElementById('log');
    let logs = [];

    function log(msg) {
      logs.push(msg);
      logEl.textContent = logs.join('\n');
    }

    async function runTests() {
      logs = [];
      log('=== Kooz Диагностика ===');
      log('');

      // 1. Проверка Telegram
      const tg = window.Telegram?.WebApp;
      log('1. Telegram WebApp: ' + (tg ? '✅ найден' : '❌ НЕ найден'));
      if (tg) {
        tg.ready();
        tg.expand();
        log('   initData length: ' + (tg.initData ? tg.initData.length : 0));
      }

      // 2. Проверка сети
      log('2. Online: ' + (navigator.onLine ? '✅ да' : '❌ нет'));

      // 3. Тест fetch к httpbin
      log('3. Тест fetch к httpbin.org...');
      try {
        const r = await fetch('https://httpbin.org/get');
        log('   ✅ httpbin: ' + r.status);
      } catch (e) {
        log('   ❌ httpbin: ' + e.name + ' — ' + e.message);
      }

      // 4. Тест fetch к бэкенду GET
      log('4. Тест fetch к бэкенду GET /api/masters...');
      try {
        const r = await fetch(API_URL + '/api/masters');
        const text = await r.text();
        log('   ✅ GET /api/masters: ' + r.status);
        log('   Ответ: ' + text.substring(0, 80));
      } catch (e) {
        log('   ❌ GET /api/masters: ' + e.name + ' — ' + e.message);
      }

      // 5. Тест fetch к бэкенду POST
      log('5. Тест fetch к бэкенду POST /api/auth/telegram...');
      try {
        const r = await fetch(API_URL + '/api/auth/telegram', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData: tg?.initData || 'test' }),
        });
        const text = await r.text();
        log('   ✅ POST /api/auth/telegram: ' + r.status);
        log('   Ответ: ' + text.substring(0, 100));
      } catch (e) {
        log('   ❌ POST /api/auth/telegram: ' + e.name + ' — ' + e.message);
      }

      // 6. Тест с XMLHttpRequest
      log('6. Тест XMLHttpRequest к бэкенду...');
      try {
        await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open('POST', API_URL + '/api/auth/telegram');
          xhr.setRequestHeader('Content-Type', 'application/json');
          xhr.onload = () => {
            log('   ✅ XHR: ' + xhr.status);
            log('   Ответ: ' + xhr.responseText.substring(0, 80));
            resolve();
          };
          xhr.onerror = () => reject(new Error('XHR onerror'));
          xhr.send(JSON.stringify({ initData: tg?.initData || 'test' }));
        });
      } catch (e) {
        log('   ❌ XHR: ' + e.message);
      }

      log('');
      log('=== Диагностика завершена ===');
    }

    runTests();
  </script>
</body>
</html>
